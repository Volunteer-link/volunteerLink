name: Build and Deploy Docker Image to VPS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Convert repository name to lowercase
      run: echo "REPO_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Build Docker image
      run: |
        docker build --build-arg REACT_APP_WS_URL=${{ secrets.REACT_APP_WS_URL }} \
                    --build-arg REACT_APP_CLIENT_ID_GOOGLE=${{ secrets.REACT_APP_CLIENT_ID_GOOGLE }} \
                    --build-arg REACT_APP_ENVIRONMENT=${{ secrets.REACT_APP_ENVIRONMENT }} \
                    --build-arg REACT_APP_URL_PRO=${{ secrets.REACT_APP_URL_PRO }} \
                    --build-arg REACT_APP_ACCESS_KEY=${{ secrets.REACT_APP_ACCESS_KEY }} \
                    --build-arg REACT_APP_URL_DEV=${{ secrets.REACT_APP_URL_DEV }} \
                    -t ghcr.io/${{ env.REPO_NAME }}/frontend:${{ github.sha }} .

    - name: Push Docker image
      run: |
        docker push ghcr.io/${{ env.REPO_NAME }}/frontend:${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Convert repository name to lowercase
      run: echo "REPO_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV


    - name: Deploy to VPS
      run: |
          docker pull ghcr.io/${{ env.REPO_NAME }}/frontend:${{ github.sha }}
          docker stop frontend || true
          docker rm frontend || true
          docker run -d -p 3000:80 --name frontend ghcr.io/${{ env.REPO_NAME }}/frontend:${{ github.sha }}
